<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>✨ Sparkle Squad</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07070f;--s1:#0e0e1c;--s2:#131326;--s3:#191930;--s4:#20203e;
  --pink:#ff5fa8;--pk2:#d91465;--pglow:rgba(255,95,168,0.3);
  --teal:#00d9af;--tl2:#00a882;--tglow:rgba(0,217,175,0.22);
  --gold:#ffca38;--pur:#9b6fff;--pr2:#6030e0;--puglow:rgba(155,111,255,0.22);
  --red:#ff3f5e;--grn:#00e676;--blu:#38bdf8;--org:#ff9f43;
  --txt:#d4ccf5;--mut:#55557a;--bdr:rgba(90,70,180,0.18);
  --glass:rgba(19,19,38,0.55);--glass2:rgba(14,14,28,0.65);
  --touch:44px;
}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:64px;}

/* SACRED GEOMETRY BACKGROUND */
#geo{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.055;overflow:hidden;}

/* AMBIENT GLOW */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 10% 20%,rgba(155,111,255,0.08),transparent),
             radial-gradient(ellipse 50% 35% at 88% 78%,rgba(255,95,168,0.07),transparent),
             radial-gradient(ellipse 40% 28% at 50% 50%,rgba(0,217,175,0.05),transparent);}

/* HEADER */
.hdr{position:sticky;top:0;z-index:300;
  background:var(--glass2);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-bottom:1px solid var(--bdr);padding:.65rem 1rem;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
.logo{display:flex;align-items:center;gap:.6rem;}
.logo-mark{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--pk2),var(--pr2));
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  box-shadow:0 0 18px var(--pglow);flex-shrink:0;}
.logo-name{font-size:.95rem;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--pink),var(--pur),var(--teal));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:.52rem;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;}
.hdr-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.squad-row{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.squad-lbl{font-size:.6rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;}
.mpill{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:20px;
  border:1.5px solid var(--bdr);cursor:pointer;font-size:.74rem;font-weight:700;
  background:rgba(19,19,38,.4);transition:all .18s;touch-action:manipulation;min-height:var(--touch);}
.mpill.on{border-color:var(--pink);background:rgba(255,95,168,.13);color:var(--pink);box-shadow:0 0 12px var(--pglow);}
.mpill:hover:not(.on){border-color:rgba(155,111,255,.4);}
.mav{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:900;flex-shrink:0;}
.icon-btn{padding:.3rem .65rem;border-radius:8px;border:none;cursor:pointer;font-size:.68rem;
  font-weight:700;font-family:inherit;transition:all .18s;touch-action:manipulation;min-height:var(--touch);display:flex;align-items:center;gap:.3rem;}
.icon-btn.ghost{background:rgba(19,19,38,.4);color:var(--mut);border:1px solid var(--bdr);}
.icon-btn.ghost:hover{border-color:var(--pur);color:var(--pur);}
.icon-btn.danger{background:rgba(255,63,94,.1);color:var(--red);border:1px solid rgba(255,63,94,.25);}
.icon-btn.primary{background:linear-gradient(135deg,var(--pk2),var(--pr2));color:#fff;}

/* CONFIRM STRIP */
.confirm-strip{background:rgba(255,63,94,.1);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,63,94,.2);
  padding:.6rem 1rem;display:none;align-items:center;gap:.6rem;flex-wrap:wrap;position:relative;z-index:200;}
.confirm-strip.open{display:flex;}
.confirm-msg{font-size:.78rem;color:var(--red);flex:1;min-width:180px;}
.confirm-strip input{background:var(--s3);border:1px solid var(--bdr);border-radius:8px;
  padding:.4rem .7rem;color:var(--txt);font-size:.82rem;font-family:inherit;width:160px;min-height:var(--touch);}
.confirm-strip input:focus{outline:none;border-color:var(--pink);}

/* SYNC STRIP */
.sync-strip{background:rgba(0,217,175,.07);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,217,175,.15);
  padding:.55rem 1rem;display:none;align-items:center;gap:.6rem;flex-wrap:wrap;z-index:199;position:relative;}
.sync-strip.open{display:flex;}
.sync-strip input{background:var(--s3);border:1px solid var(--bdr);border-radius:8px;
  padding:.35rem .65rem;color:var(--txt);font-size:.82rem;font-family:inherit;width:140px;min-height:var(--touch);text-transform:uppercase;letter-spacing:.1em;}
.sync-msg{font-size:.72rem;color:var(--teal);flex:1;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex-shrink:0;}
.sync-dot.live{background:var(--grn);box-shadow:0 0 6px var(--grn);animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* HUB TABS */
.hub-nav{display:flex;background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);padding:0 1rem;overflow-x:auto;
  scrollbar-width:none;position:relative;z-index:10;}
.hub-nav::-webkit-scrollbar{display:none;}
.htab{padding:.8rem 1.1rem;cursor:pointer;border-bottom:2.5px solid transparent;
  font-size:.8rem;font-weight:800;color:var(--mut);transition:all .18s;white-space:nowrap;
  display:flex;align-items:center;gap:.45rem;touch-action:manipulation;min-height:var(--touch);}
.htab.on{color:var(--pink);border-bottom-color:var(--pink);}
.htab:hover:not(.on){color:var(--txt);}
.hdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.htab.on .hdot{box-shadow:0 0 7px currentColor;}
.hbadge{background:rgba(255,95,168,.18);color:var(--pink);border-radius:10px;padding:.04rem .42rem;font-size:.6rem;font-weight:900;}

/* VIEW TABS */
.vnav{display:flex;gap:.35rem;padding:.75rem 1rem 0;flex-wrap:wrap;
  background:rgba(14,14,28,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  position:relative;z-index:9;overflow-x:auto;scrollbar-width:none;}
.vnav::-webkit-scrollbar{display:none;}
.vtab{padding:.32rem .82rem;border-radius:20px;cursor:pointer;font-size:.72rem;font-weight:700;
  border:1.5px solid var(--bdr);color:var(--mut);background:rgba(19,19,38,.4);
  transition:all .18s;white-space:nowrap;touch-action:manipulation;min-height:38px;display:flex;align-items:center;}
.vtab.on{border-color:var(--pur);color:var(--pur);background:rgba(155,111,255,.12);}

/* MAIN */
.main{padding:1rem;max-width:1280px;margin:0 auto;position:relative;z-index:1;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem;}
.sc{border-radius:14px;padding:.85rem .5rem;text-align:center;border:1px solid var(--bdr);transition:all .2s;
  background:rgba(19,19,38,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.sc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5);}
.sc.pk{border-color:rgba(255,95,168,.3);}
.sc.tl{border-color:rgba(0,217,175,.3);}
.sc.pp{border-color:rgba(155,111,255,.3);}
.sc.gd{border-color:rgba(255,202,56,.3);}
.sn{font-size:1.7rem;font-weight:900;line-height:1;}
.sl{font-size:.55rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-top:.2rem;}

/* TOOLBAR */
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;flex-wrap:wrap;gap:.5rem;}
.bar-title{font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;}
.bar-actions{display:flex;gap:.35rem;flex-wrap:wrap;}

/* BUTTONS */
.btn{padding:.42rem .9rem;border-radius:10px;border:none;cursor:pointer;font-size:.75rem;
  font-weight:800;transition:all .18s;font-family:inherit;touch-action:manipulation;
  min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center;gap:.3rem;}
.btn:hover{transform:translateY(-1px);}
.btn:active{transform:translateY(0) scale(.97);}
.btn-pk{background:linear-gradient(135deg,var(--pk2),var(--pr2));color:#fff;box-shadow:0 2px 14px var(--pglow);}
.btn-pk:hover{box-shadow:0 4px 20px var(--pglow);}
.btn-tl{background:linear-gradient(135deg,var(--tl2),#009ab4);color:#000;font-weight:900;box-shadow:0 2px 10px var(--tglow);}
.btn-gh{background:rgba(25,25,48,.5);color:var(--txt);border:1px solid var(--bdr);backdrop-filter:blur(8px);}
.btn-gh:hover{border-color:var(--pur);color:var(--pur);}
.btn-sm{padding:.3rem .7rem;font-size:.7rem;border-radius:8px;min-height:36px;}
.btn-del{background:rgba(255,63,94,.12);color:var(--red);border:1px solid rgba(255,63,94,.25);}
.btn-del:hover{background:rgba(255,63,94,.24);}
.btn-ok{background:rgba(0,230,118,.12);color:var(--grn);border:1px solid rgba(0,230,118,.25);}
.btn-ok:hover{background:rgba(0,230,118,.24);}

/* FORM */
.aform{background:rgba(19,19,38,.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--bdr);border-radius:16px;padding:1.1rem;margin-bottom:1.1rem;display:none;}
.aform.open{display:block;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.65rem;}
.frow.t3{grid-template-columns:1fr 1fr 1fr;}
.frow.f1{grid-template-columns:1fr;}
.fg{display:flex;flex-direction:column;gap:.28rem;}
.fg label{font-size:.62rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;}
.fg input,.fg select,.fg textarea{background:var(--s3);border:1px solid var(--bdr);border-radius:9px;
  padding:.5rem .7rem;color:var(--txt);font-size:.84rem;font-family:inherit;
  min-height:var(--touch);transition:border-color .18s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--pur);box-shadow:0 0 0 3px var(--puglow);}
.fg select option{background:var(--s3);}
.fg textarea{resize:vertical;min-height:72px;}
.fend{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.75rem;flex-wrap:wrap;}
.cmd-banner{display:flex;align-items:center;gap:.5rem;margin-bottom:.85rem;padding:.4rem .75rem;
  background:rgba(255,63,94,.08);border:1px solid rgba(255,63,94,.22);border-radius:9px;font-size:.72rem;color:var(--red);font-weight:700;}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;}
.kcol{background:rgba(19,19,38,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bdr);border-radius:15px;padding:.9rem;}
.kcol-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;padding-bottom:.65rem;border-bottom:1px solid var(--bdr);}
.kcol-nm{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;}
.kcol-ct{background:var(--s3);border-radius:10px;padding:.08rem .45rem;font-size:.62rem;color:var(--mut);}
.tlist{display:flex;flex-direction:column;gap:.5rem;min-height:40px;}

/* TASK CARD */
.tc{background:rgba(25,25,48,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--bdr);border-radius:12px;padding:.82rem;transition:all .2s;
  position:relative;overflow:hidden;border-left-width:3px;touch-action:manipulation;}
.tc.pnd{cursor:pointer;border-left-color:var(--mut);}
.tc.inp{border-left-color:var(--teal);box-shadow:0 0 12px rgba(0,217,175,.08);}
.tc.dn{opacity:.55;border-left-color:var(--grn);}
.tc.urg{border-left-color:var(--red);}
.tc:hover{border-color:rgba(155,111,255,.35);transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.5);}
.tc:active{transform:translateY(0);}
.tc-ttl{font-size:.83rem;font-weight:700;line-height:1.3;margin-bottom:.3rem;}
.tc-ttl.dk{text-decoration:line-through;color:var(--mut);}
.tc-desc{font-size:.72rem;color:var(--mut);margin-bottom:.5rem;line-height:1.38;}
.tc-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.35rem;}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.achip{display:inline-flex;align-items:center;gap:.25rem;background:rgba(155,111,255,.13);
  border-radius:20px;padding:.16rem .48rem;font-size:.67rem;color:var(--pur);}
.achip.me{border:1px solid var(--pink);color:var(--pink);background:rgba(255,95,168,.1);}
.fq{font-size:.6rem;border-radius:10px;padding:.1rem .42rem;font-weight:700;}
.fq-daily{background:rgba(0,217,175,.1);color:var(--teal);}
.fq-weekly{background:rgba(155,111,255,.1);color:var(--pur);}
.fq-monthly{background:rgba(255,202,56,.1);color:var(--gold);}
.fq-asneeded{background:rgba(56,189,248,.1);color:var(--blu);}
.fq-setup{background:rgba(255,159,67,.1);color:var(--org);}
.timer-box{display:flex;align-items:center;gap:.35rem;margin:.35rem 0;padding:.3rem .55rem;
  background:rgba(0,217,175,.08);border:1px solid rgba(0,217,175,.2);border-radius:8px;}
.tmr{font-family:'Courier New',monospace;font-weight:900;font-size:.74rem;color:var(--teal);}
.blink{animation:pulse 1.4s ease infinite;}
.dur-chip{font-size:.62rem;color:var(--grn);background:rgba(0,230,118,.1);border-radius:10px;padding:.1rem .45rem;}
.est-chip{font-size:.62rem;color:var(--gold);background:rgba(255,202,56,.08);border-radius:10px;padding:.1rem .45rem;cursor:pointer;border:1px dashed rgba(255,202,56,.3);}
.tc-btns{display:flex;gap:.3rem;flex-wrap:wrap;}
.tcb{padding:.26rem .6rem;border-radius:7px;border:none;cursor:pointer;font-size:.67rem;font-weight:800;
  transition:all .15s;font-family:inherit;touch-action:manipulation;min-height:32px;display:inline-flex;align-items:center;}
.tcb:active{transform:scale(.95);}
.tcb-start{background:rgba(0,217,175,.14);color:var(--teal);border:1px solid rgba(0,217,175,.28);}
.tcb-done{background:rgba(0,230,118,.14);color:var(--grn);border:1px solid rgba(0,230,118,.28);}
.tcb-reopen{background:rgba(155,111,255,.12);color:var(--pur);border:1px solid rgba(155,111,255,.22);}
.tcb-mine{background:rgba(255,95,168,.12);color:var(--pink);border:1px solid rgba(255,95,168,.22);}
.tcb-detail{background:var(--s4);color:var(--mut);border:1px solid var(--bdr);}
.tcb-del{background:rgba(255,63,94,.1);color:var(--red);border:1px solid rgba(255,63,94,.22);}

/* MODAL */
.movl{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;
  display:none;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(6px);overflow-y:auto;}
.movl.open{display:flex;}
.modal{background:rgba(19,19,38,.85);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid var(--bdr);border-radius:20px 20px 0 0;padding:1.5rem 1.25rem;
  max-width:520px;width:100%;position:relative;max-height:90vh;overflow-y:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.6);}
@media(min-width:640px){
  .movl{align-items:center;}
  .modal{border-radius:20px;max-height:85vh;}
}
.modal-drag{width:36px;height:4px;background:var(--s4);border-radius:2px;margin:0 auto .85rem;}
.mclose{position:absolute;top:.85rem;right:.85rem;background:var(--s3);border:1px solid var(--bdr);
  color:var(--mut);width:30px;height:30px;border-radius:50%;cursor:pointer;
  font-size:1rem;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.mclose:hover{color:var(--txt);}
.mtitle{font-size:.95rem;font-weight:900;margin-bottom:1rem;line-height:1.3;}

/* CLEANING */
.czones{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:.9rem;}
.cz{background:rgba(19,19,38,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bdr);border-radius:15px;padding:.9rem;}
.cz-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem;padding-bottom:.65rem;border-bottom:1px solid var(--bdr);}
.cz-nm{font-size:.86rem;font-weight:800;display:flex;align-items:center;gap:.4rem;}
.pbar{width:52px;height:5px;background:var(--s4);border-radius:3px;overflow:hidden;}
.pfil{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--pur));transition:width .4s;}
.ptxt{font-size:.64rem;color:var(--mut);}
.ctask{display:flex;align-items:center;gap:.5rem;padding:.5rem .3rem;
  border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;border-radius:6px;touch-action:manipulation;min-height:var(--touch);}
.ctask:last-child{border-bottom:none;}
.ctask:hover,.ctask:active{background:rgba(255,255,255,.04);}
.cbox{width:22px;height:22px;border-radius:7px;border:2px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;font-size:.72rem;}
.cbox.chk{background:var(--grn);border-color:var(--grn);color:#000;font-weight:900;box-shadow:0 0 7px rgba(0,230,118,.3);}
.ctask-info{flex:1;min-width:0;}
.ctask-nm{font-size:.82rem;font-weight:600;}
.ctask-nm.dk{text-decoration:line-through;color:var(--mut);}
.ctask-sub{font-size:.62rem;color:var(--mut);margin-top:.06rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.est-badge{font-size:.6rem;color:var(--gold);background:rgba(255,202,56,.1);border-radius:10px;
  padding:.1rem .45rem;cursor:pointer;border:1px dashed rgba(255,202,56,.3);font-family:inherit;touch-action:manipulation;}
.act-badge{font-size:.6rem;color:var(--grn);background:rgba(0,230,118,.1);border-radius:10px;padding:.1rem .45rem;}
.cbtn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px dashed var(--bdr);background:none;cursor:pointer;font-size:.85rem;transition:all .18s;
  flex-shrink:0;touch-action:manipulation;}
.cbtn:hover,.cbtn:active{border-color:var(--teal);background:rgba(0,217,175,.1);}
.cbtn.asgnd{border-style:solid;border-color:var(--pur);background:rgba(155,111,255,.12);}

/* LOG */
.logbox{background:rgba(19,19,38,.45);backdrop-filter:blur(16px);border:1px solid var(--bdr);border-radius:15px;padding:1rem;}
.logs{display:flex;flex-direction:column;gap:.44rem;max-height:420px;overflow-y:auto;}
.le{display:flex;gap:.65rem;padding:.58rem .72rem;border-radius:12px;background:rgba(25,25,48,.5);border-left:3px solid var(--pur);}
.le.ls{border-left-color:var(--teal);}
.le.lc{border-left-color:var(--grn);}
.le.la{border-left-color:var(--pink);}
.lav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:900;flex-shrink:0;}
.ltxt{font-size:.78rem;line-height:1.38;}
.ltxt strong{color:#ece6ff;}
.ltime{font-size:.62rem;color:var(--mut);margin-top:.15rem;}

/* TEAM */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;}
.tmcard{background:rgba(19,19,38,.45);backdrop-filter:blur(16px);border:1px solid var(--bdr);
  border-radius:15px;padding:1.2rem;text-align:center;transition:all .2s;}
.tmcard:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,0,0,.6);}
.tav-lg{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;margin:0 auto .7rem;border:3px solid transparent;}
.tm-nm{font-size:.95rem;font-weight:800;margin-bottom:.18rem;}
.tm-rl{font-size:.7rem;color:var(--mut);margin-bottom:.78rem;}
.tm-st{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.tm-s{background:rgba(25,25,48,.5);border-radius:9px;padding:.45rem;border:1px solid var(--bdr);}
.tm-sn{font-size:1rem;font-weight:900;}
.tm-sl{font-size:.58rem;color:var(--mut);}

/* BOTTOM NAV (mobile) */

// INIT & SAVE

function init(){
  try{const r=localStorage.getItem(STORE_KEY);if(r){const p=JSON.parse(r);S={...S,...p,timers:{},pending:null,syncInterval:null};}}catch(e){}
  if(!S.members.length)defaultMembers();
  if(!S.hubs.length||!S.hubs.find(h=>h.id==='spokane')||!S.hubs.find(h=>h.id==='sandpoint'))defaultHubs();
  if(!S.hub)S.hub=S.hubs[0]?.id;
  // BroadcastChannel for same-device cross-tab sync
  try{
    const bc=new BroadcastChannel('sparkle_squad');
    bc.onmessage=e=>{if(e.data?.type==='state'){const ns=e.data.state;if(ns){S.hubs=ns.hubs;S.members=ns.members;S.log=ns.log;render();}}};
    S._bc=bc;
  }catch(e){}
  if(S.syncId)resumeSync();
  render();
  setTimeout(()=>S.hubs.forEach(h=>h.tasks.forEach(t=>{if(t.status==='inp'&&t.startedAt)startTmr(t.id);})),120);
}

function save(){
  try{
    const {timers,pending,syncInterval,_bc,...rest}=S;
    const str=JSON.stringify(rest);
    localStorage.setItem(STORE_KEY,str);
    if(S._bc)S._bc.postMessage({type:'state',state:rest});
    if(S.syncId)pushSync();
  }catch(e){}
}

function tryAction(action,arg){
  if(!S.me){showInfo('Select yourself in the header first.');return;}
  if(!isAdmin()){showInfo('Only Commander or Magz can do this.');return;}
  const me=S.members.find(m=>m.id===S.me);
  const labels={reset:'reset ALL data',delTask:'delete this task',clearLog:'clear the log',removeMember:'remove this member',resetZones:'reset all cleaning'};
  S.pending={action,arg};
  const cs=document.getElementById('confirmStrip');
  const ci=document.getElementById('confirmInput');
  document.getElementById('confirmMsg').textContent='Type "'+me.name+'" to confirm: '+labels[action];
  ci.value='';ci.style.borderColor='';ci.style.display='';
  document.querySelector('#confirmStrip .btn-del').style.display='';
  cs.classList.add('open');
  setTimeout(()=>ci.focus(),60);
}

function showInfo(msg){
  const cs=document.getElementById('confirmStrip');
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmInput').style.display='none';
  document.querySelector('#confirmStrip .btn-del').style.display='none';
  cs.classList.add('open');
  setTimeout(closeConfirm,2500);
}

function closeConfirm(){
  document.getElementById('confirmStrip').classList.remove('open');
  document.getElementById('confirmInput').style.display='';
  document.querySelector('#confirmStrip .btn-del').style.display='';
  S.pending=null;
}

function doConfirm(){
  const me=S.members.find(m=>m.id===S.me);
  const inp=document.getElementById('confirmInput').value.trim();
  if(!me||inp!==me.name){
    document.getElementById('confirmMsg').textContent='Name did not match — try again.';
    document.getElementById('confirmInput').style.borderColor='var(--red)';
    return;
  }
  const {action,arg}=S.pending||{};
  S.pending=null;
  closeConfirm();
  if(action==='reset')doReset();
  else if(action==='delTask')doDelTask(arg);
  else if(action==='clearLog'){S.log=[];save();rLog();}
  else if(action==='removeMember')doRemoveMember(arg);
  else if(action==='resetZones')doResetZones();
}

function doReset(){
  Object.keys(S.timers).forEach(id=>clearInterval(S.timers[id]));
  clearInterval(S.syncInterval);
  S={members:[],me:null,hubs:[],hub:null,view:'tasks',sec:'all',log:[],timers:{},clr:'#9b6fff',pending:null,syncId:null,syncInterval:null};
  localStorage.removeItem(STORE_KEY);
  defaultMembers();defaultHubs();S.hub=S.hubs[0]?.id;
  render();
  setTimeout(()=>S.hubs.forEach(h=>h.tasks.forEach(t=>{if(t.status==='inp'&&t.startedAt)startTmr(t.id);})),120);
}
function doDelTask(id){const h=getHub();const t=h.tasks.find(x=>x.id===id);if(t)addLog('la',S.me,'Deleted: '+t.title);h.tasks=h.tasks.filter(x=>x.id!==id);if(S.timers[id])clearInterval(S.timers[id]);closeModal('taskModal');save();render();}
function doRemoveMember(id){const m=S.members.find(x=>x.id===id);if(!m)return;S.members=S.members.filter(x=>x.id!==id);if(S.me===id)S.me=null;addLog('la',null,m.name+' removed');save();render();}
function doResetZones(){getHub().zones.forEach(z=>z.tasks.forEach(t=>{t.done=false;t.assignee=null;t.completedAt=null;t.startedAt=null;t.actMin=null;}));addLog('la',S.me,'Reset all cleaning');save();rMain();}

// ─────────────────────────────────────────────
// MULTI-DEVICE SYNC (jsonblob.com)
// ─────────────────────────────────────────────
function toggleSync(){
  const ss=document.getElementById('syncStrip');
  ss.classList.toggle('open');
  if(ss.classList.contains('open'))document.getElementById('syncPin').focus();
}

function getStateForSync(){
  const {timers,pending,syncInterval,_bc,...rest}=S;
  return rest;
}

async function createSync(){
  setSyncStatus('Creating sync PIN...','var(--gold)');
  try{
    const r=await fetch(SYNC_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(getStateForSync())});
    if(!r.ok)throw new Error('API error');
    const loc=r.headers.get('Location');
    const id=loc.split('/').pop();
    const pin='HUB-'+id.slice(-4).toUpperCase();
    S.syncId=id;
    document.getElementById('syncPin').value=pin;
    setSyncStatus('✅ PIN: '+pin+' — share with your team!','var(--grn)');
    document.getElementById('syncDot').classList.add('live');
    startSyncPoll();
    save();
  }catch(e){setSyncStatus('⚠️ Could not create sync. Check connection.','var(--red)');}
}

async function joinSync(){
  const pin=document.getElementById('syncPin').value.trim().toUpperCase();
  if(!pin||pin.length<4){setSyncStatus('Enter a valid Sync PIN','var(--red)');return;}
  setSyncStatus('Connecting...','var(--gold)');
  try{
    // Try to find blob by last 4 chars - user must enter full ID if 8 chars
    const id=pin.replace('HUB-','').toLowerCase();
    const r=await fetch(SYNC_API+'/'+id);
    if(!r.ok)throw new Error('Not found');
    const data=await r.json();
    S.hubs=data.hubs||S.hubs;
    S.members=data.members||S.members;
    S.log=data.log||S.log;
    S.syncId=id;
    setSyncStatus('🔗 Synced! PIN: HUB-'+id.slice(-4).toUpperCase(),'var(--grn)');
    document.getElementById('syncDot').classList.add('live');
    startSyncPoll();
    save();render();
  }catch(e){setSyncStatus('⚠️ PIN not found. Check and try again.','var(--red)');}
}

async function pushSync(){
  if(!S.syncId)return;
  try{await fetch(SYNC_API+'/'+S.syncId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(getStateForSync())});}catch(e){}
}

async function pullSync(){
  if(!S.syncId)return;
  try{
    const r=await fetch(SYNC_API+'/'+S.syncId);
    if(!r.ok)return;
    const data=await r.json();
    // Merge: take whichever has more recent log entries
    if(data.log&&data.log.length>S.log.length){
      S.hubs=data.hubs;S.members=data.members;S.log=data.log;
      render();
      localStorage.setItem(STORE_KEY,JSON.stringify(getStateForSync()));
    }
  }catch(e){}
}

function startSyncPoll(){
  clearInterval(S.syncInterval);
  S.syncInterval=setInterval(pullSync,30000);
}

function resumeSync(){if(S.syncId)startSyncPoll();}

function leaveSync(){
  clearInterval(S.syncInterval);
  S.syncId=null;S.syncInterval=null;
  document.getElementById('syncPin').value='';
  document.getElementById('syncDot').classList.remove('live');
  setSyncStatus('Sync disconnected.','var(--mut)');
  setTimeout(()=>document.getElementById('syncStrip').classList.remove('open'),1500);
  save();
}

function setSyncStatus(msg,color){
  const el=document.getElementById('syncMsg');
  el.textContent=msg;el.style.color=color||'var(--teal)';
}

function zCard(z){
  const dn=z.tasks.filter(t=>t.done).length;
  const pct=z.tasks.length?Math.round(dn/z.tasks.length*100):0;
  const fc={daily:'var(--teal)',weekly:'var(--pur)',monthly:'var(--gold)',asneeded:'var(--blu)',setup:'var(--org)'};
  return '<div class="cz"><div class="cz-hd"><div class="cz-nm">'+z.emoji+' '+z.name+'</div>'+
    '<div style="display:flex;align-items:center;gap:.5rem"><div class="pbar"><div class="pfil" style="width:'+pct+'%"></div></div><div class="ptxt">'+dn+'/'+z.tasks.length+'</div></div></div>'+
    z.tasks.map(t=>{
      const m=S.members.find(x=>x.id===t.assignee);
      const estHtml=t.actMin
        ?'<span class="act-badge">'+t.actMin+'m actual</span>'+(t.estMin?'<span class="est-badge">'+t.estMin+'m est</span>':'')
        :(t.estMin?'<button class="est-badge" onclick="event.stopPropagation();editEst(\''+z.id+'\',\''+t.id+'\')">'+t.estMin+'m est ✏️</button>':'<button class="est-badge" onclick="event.stopPropagation();editEst(\''+z.id+'\',\''+t.id+'\')">+ est time</button>');
      return '<div class="ctask" onclick="toggleClean(\''+z.id+'\',\''+t.id+'\')">'+
        '<div class="cbox '+(t.done?'chk':'')+'">'+( t.done?'✓':'')+'</div>'+
        '<div class="ctask-info"><div class="ctask-nm '+(t.done?'dk':'')+'">'+esc(t.name)+'</div>'+
        '<div class="ctask-sub">'+
        (t.freq?'<span style="color:'+fc[t.freq||'asneeded']+';font-size:.62rem">'+t.freq+'</span>':'')+
        (m?' <span>'+m.name+'</span>':'')+
        (t.completedAt?'<span style="color:var(--grn)">✅ '+fmtTime(t.completedAt)+'</span>':'')+
        estHtml+'</div></div>'+
        '<button class="cbtn '+(t.assignee?'asgnd':'')+'" onclick="event.stopPropagation();claimClean(\''+z.id+'\',\''+t.id+'\')" title="Claim">'+
        (m?m.emoji:'👤')+'</button></div>';
    }).join('')+'</div>';
}

// Est edit using a proper modal (no window.prompt — works on all devices/browsers)
function editEst(zid,tid){
  const h=getHub();const z=h.zones.find(x=>x.id===zid);const t=z?.tasks.find(x=>x.id===tid);if(!t)return;
  document.getElementById('estModalBody').innerHTML=
    '<div style="font-size:.9rem;color:var(--txt);margin-bottom:1rem;">'+esc(t.name)+'</div>'+
    '<div class="fg" style="margin-bottom:1rem;"><label>Estimated minutes</label>'+
    '<input type="number" id="estVal" value="'+(t.estMin||'')+'" placeholder="e.g. 15" min="1" style="font-size:1rem;"></div>'+
    '<div class="fend">'+
    '<button class="btn btn-gh btn-sm" onclick="closeModal(\'estModal\')">Cancel</button>'+
    '<button class="btn btn-pk btn-sm" onclick="saveEst(\''+zid+'\',\''+tid+'\')">Save</button>'+
    '</div>';
  openModal('estModal');
  setTimeout(()=>document.getElementById('estVal')?.focus(),100);
}

function saveEst(zid,tid){
  const val=parseInt(document.getElementById('estVal')?.value);
  if(!isNaN(val)&&val>0){
    const h=getHub();const z=h.zones.find(x=>x.id===zid);const t=z?.tasks.find(x=>x.id===tid);
    if(t){t.estMin=val;addLog('la',S.me,'Set est. '+val+'min for: '+t.name);save();rMain();}
  }
  closeModal('estModal');
}

function toggleClean(zid,tid){
  const h=getHub();const z=h.zones.find(x=>x.id===zid);const t=z?.tasks.find(x=>x.id===tid);if(!t)return;
  const who=S.me||t.assignee;
  if(!t.done){
    const start=t.startedAt?new Date(t.startedAt):new Date();
    t.done=true;t.completedAt=new Date().toISOString();
    if(!t.startedAt)t.startedAt=t.completedAt;
    t.actMin=Math.max(1,Math.round((new Date(t.completedAt)-start)/60000));
    if(!t.assignee&&who)t.assignee=who;
    addLog('lc',who,'Cleaning done: '+t.name+' (est:'+(t.estMin||'?')+'m, actual:'+t.actMin+'m)');
  }else{t.done=false;t.completedAt=null;t.actMin=null;t.startedAt=null;addLog('la',who,'Unchecked: '+t.name);}
  save();rMain();
}

function claimClean(zid,tid){
  if(!S.me)return;
  const h=getHub();const z=h.zones.find(x=>x.id===zid);const t=z?.tasks.find(x=>x.id===tid);if(!t)return;
  t.assignee=S.me;if(!t.startedAt)t.startedAt=new Date().toISOString();
  const me=S.members.find(m=>m.id===S.me);
  addLog('ls',S.me,(me?.name||'?')+' claimed: '+t.name);save();rMain();
}

function addZone(){
  const name=document.getElementById('nz_nm')?.value.trim();if(!name)return;
  const h=getHub();
  const lines=(document.getElementById('nz_ts')?.value||'').split('\n').map(l=>l.trim()).filter(Boolean);
  h.zones.push({id:'z'+Date.now(),name,emoji:document.getElementById('nz_em')?.value.trim()||'🧹',
    tasks:lines.map((l,i)=>({id:'c'+Date.now()+i,name:l,done:false,assignee:null,freq:'asneeded',completedAt:null,startedAt:null,estMin:null,actMin:null}))});
  addLog('la',S.me,'Added zone: '+name);tf('addZF');save();rMain();
}

// ─────────────────────────────────────────────
// TEAM
// ─────────────────────────────────────────────
function rTeam(){
  document.getElementById('mainContent').innerHTML=
    '<div class="bar"><div class="bar-title">👥 The Squad</div><button class="btn btn-pk btn-sm" onclick="openModal(\'memberModal\')">+ Add Member</button></div>'+
    '<div class="tgrid">'+S.members.map(m=>{
      const all=S.hubs.flatMap(h=>h.tasks).filter(t=>t.assignee===m.id);
      const dn=all.filter(t=>t.status==='dn').length,inp=all.filter(t=>t.status==='inp').length;
      const cDone=S.hubs.flatMap(h=>h.zones.flatMap(z=>z.tasks)).filter(t=>t.assignee===m.id&&t.done).length;
      return '<div class="tmcard" style="border-color:'+m.color+'30">'+
        '<div class="tav-lg" style="background:'+m.color+';color:#000;border-color:'+m.color+'">'+m.emoji+'</div>'+
        '<div class="tm-nm">'+esc(m.name)+'</div><div class="tm-rl">'+esc(m.role)+'</div>'+
        '<div class="tm-st">'+
        '<div class="tm-s"><div class="tm-sn" style="color:var(--pink)">'+all.length+'</div><div class="tm-sl">Tasks</div></div>'+
        '<div class="tm-s"><div class="tm-sn" style="color:var(--grn)">'+dn+'</div><div class="tm-sl">Done</div></div>'+
        '<div class="tm-s"><div class="tm-sn" style="color:var(--teal)">'+inp+'</div><div class="tm-sl">Active</div></div>'+
        '<div class="tm-s"><div class="tm-sn" style="color:var(--gold)">'+cDone+'</div><div class="tm-sl">Cleans</div></div>'+
        '</div>'+
        '<div style="display:flex;gap:.4rem;margin-top:.8rem;justify-content:center;">'+
        '<button class="btn btn-gh btn-sm" onclick="setMe(\''+m.id+'\');setView(\'tasks\')">My Tasks</button>'+
        '<button class="btn btn-del btn-sm" onclick="tryAction(\'removeMember\',\''+m.id+'\')">Remove</button>'+
        '</div></div>';
    }).join('')+'</div>';
}

function addMember(){
  const name=document.getElementById('am_name')?.value.trim();if(!name)return;
  const m={id:'m'+Date.now(),name,role:document.getElementById('am_role')?.value.trim()||'Member',
    emoji:document.getElementById('am_emoji')?.value.trim()||name[0].toUpperCase(),color:S.clr||COLORS[0]};
  S.members.push(m);S.me=m.id;
  addLog('la',m.id,m.name+' joined the squad!');
  closeModal('memberModal');save();render();
}

// ─────────────────────────────────────────────
// LOG
// ─────────────────────────────────────────────
function rLog(){
  document.getElementById('mainContent').innerHTML=
    '<div class="bar"><div class="bar-title">📜 Activity Log</div>'+
    '<button class="btn btn-del btn-sm" onclick="tryAction(\'clearLog\')">Clear Log</button></div>'+
    '<div class="logbox"><div class="logs">'+
    (S.log.length?S.log.map(e=>{
      const m=S.members.find(x=>x.id===e.mid);
      return '<div class="le '+e.type+'">'+
        '<div class="lav" style="background:'+(m?m.color:'#444')+';color:#000">'+(m?m.emoji:'⚙')+'</div>'+
        '<div><div class="ltxt"><strong>'+(m?m.name:'System')+'</strong> '+esc(e.text)+'</div>'+
        '<div class="ltime">'+fmtDT(e.time)+'</div></div></div>';
    }).join(''):'<div class="empty">No activity yet</div>')+
    '</div></div>';
}

// ─────────────────────────────────────────────
// TIMERS
// ─────────────────────────────────────────────
function startTmr(id){
  if(S.timers[id])clearInterval(S.timers[id]);
  S.timers[id]=setInterval(()=>{
    const t=findTask(id);if(!t||!t.startedAt){clearInterval(S.timers[id]);return;}
    ['tmr_'+id,'modal_tmr_'+id].forEach(sel=>{const el=document.getElementById(sel);if(el)el.textContent=elp(t.startedAt);});
  },1000);
}

// ─────────────────────────────────────────────
// MEMBER MODAL HELPERS
// ─────────────────────────────────────────────
function openModal(id){
  const el=document.getElementById(id);if(!el)return;
  if(id==='memberModal'){
    S.clr=COLORS[0];
    document.getElementById('am_name').value='';
    document.getElementById('am_role').value='';
    document.getElementById('am_emoji').value='';
    document.getElementById('colorPicker').innerHTML=COLORS.map(c=>
      '<div onclick="pickClr(this,\''+c+'\')" style="width:28px;height:28px;border-radius:50%;background:'+c+';cursor:pointer;border:2.5px solid '+(c===S.clr?'#fff':'transparent')+';transition:all .18s;touch-action:manipulation;"></div>'
    ).join('');
  }
  el.classList.add('open');
}
function closeModal(id){document.getElementById(id)?.classList.remove('open');}
function pickClr(el,c){S.clr=c;document.querySelectorAll('#colorPicker div').forEach(d=>d.style.border='2.5px solid transparent');el.style.border='2.5px solid #fff';}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function getHub(){return S.hubs.find(h=>h.id===S.hub);}
function findTask(id){for(const h of S.hubs){const t=h.tasks.find(x=>x.id===id);if(t)return t;}return null;}
function isCommander(){return S.me&&S.members.find(m=>m.id===S.me)?.name==='Commander';}
function isAdmin(){return S.me&&['Commander','Magz'].includes(S.members.find(m=>m.id===S.me)?.name);}
function setMe(id){S.me=S.me===id?null:id;save();rMems();}
function setHub(id){Object.keys(S.timers).forEach(tid=>clearInterval(S.timers[tid]));S.timers={};S.hub=id;S.sec='all';save();render();setTimeout(()=>getHub()?.tasks.filter(t=>t.status==='inp'&&t.startedAt).forEach(t=>startTmr(t.id)),100);}
function setView(v){S.view=v;S.sec='all';save();render();}
function setSec(s){S.sec=s;save();rViewTabs();rMain();}
function tf(id){document.getElementById(id)?.classList.toggle('open');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function elp(s){const d=Math.floor((Date.now()-new Date(s))/1000),h=Math.floor(d/3600),m=Math.floor((d%3600)/60),ss=d%60;return h?h+'h '+m+'m '+ss+'s':m?m+'m '+ss+'s':ss+'s';}
function fmtDT(iso){const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}
function addLog(type,mid,text){S.log.unshift({id:'l'+Date.now(),type,mid,text,time:new Date().toISOString()});if(S.log.length>300)S.log.length=300;}

// Close modals on overlay click
['taskModal','memberModal','estModal'].forEach(id=>{
  const el=document.getElementById(id);
  if(el)el.addEventListener('click',e=>{if(e.target===el)closeModal(id);});
});

init();
</script>
