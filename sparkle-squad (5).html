            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            animation: confetti 3s ease-out forwards;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 40px rgba(236, 72, 153, 0.8); }
        }
        .pulse-glow { animation: pulse-glow 2s infinite; }
        @keyframes bounce-in {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .bounce-in { animation: bounce-in 0.5s ease-out; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float { animation: float 2s ease-in-out infinite; }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }

                    setSessionData(prev => ({

                        teamMembers: {
                            ...prev.teamMembers,

                const now = new Date().toISOString();
                
                setSessionData(prev => {
                    const newChecked = { ...prev.checkedItems };
                    const newTeam = { ...prev.teamMembers };
                    const newLog = [...prev.completionLog];
                    
                    if (wasChecked) {
                        // Unchecking - remove points from all who checked it
                        const completers = wasChecked.users || [wasChecked.user];
                        delete newChecked[id];
                        completers.forEach(user => {
                            if (newTeam[user]) {
                                // Calculate what points they got (with secret multiplier if team)
                                const teamSize = completers.length;
                                const actualPoints = teamSize > 1 
                                    ? Math.round(points * teamSize) // Secret: 2x, 3x, 4x!
                                    : points;
                                newTeam[user] = {
                                    ...newTeam[user],
                                    points: Math.max(0, newTeam[user].points - actualPoints),
                                    tasksCompleted: Math.max(0, newTeam[user].tasksCompleted - 1)
                                };
                            }
                        });
                    } else {
                        // Solo checking - add points to current user
                        newChecked[id] = { user: currentUser, users: [currentUser], timestamp: now };
                        newTeam[currentUser] = {
                            ...newTeam[currentUser],
                            points: (newTeam[currentUser]?.points || 0) + points,
                            tasksCompleted: (newTeam[currentUser]?.tasksCompleted || 0) + 1
                        };
                        newLog.push({ id, user: currentUser, users: [currentUser], timestamp: now, points });
                        
                        // Check for badges
                        checkBadges(currentUser, newTeam[currentUser], newChecked);

                        teamMembers: newTeam,
                        completionLog: newLog
                    };

                if (!sessionData) return null;

                const allTasks = [];
                Object.entries(sections).forEach(([sectionKey, section]) => {
                    section.items.forEach(item => {
                        if (!sessionData.checkedItems[item.id]) {
                            allTasks.push({ ...item, section: sectionKey, sectionTitle: section.title });
                        }
                    });
                });
                
                // Add custom tasks
                (sessionData.customTasks || []).forEach(task => {
                    if (!sessionData.checkedItems[task.id]) {
                        allTasks.push({ ...task, section: 'custom', sectionTitle: '⭐ Custom Task' });
                    }
                });
                
                if (allTasks.length === 0) return null;
                
                // Sort by points (highest first)
                allTasks.sort((a, b) => b.points - a.points);
                return allTasks[0];
            };

                if (!teamCompleteModal || teamCompleteModal.selectedMembers.length === 0) return;
                
                const { itemId, points, selectedMembers } = teamCompleteModal;
                const now = new Date().toISOString();
                const teamSize = selectedMembers.length;
                
                // 🤫 SECRET MULTIPLIER: More people = DOUBLE, TRIPLE, QUADRUPLE points!
                // Solo: 1x, 2 people: 2x each, 3 people: 3x each, 4 people: 4x each!
                const secretMultiplier = teamSize;
                const actualPoints = Math.round(points * secretMultiplier);
                
                setSessionData(prev => {
                    const newChecked = { ...prev.checkedItems };
                    const newTeam = { ...prev.teamMembers };
                    const newLog = [...prev.completionLog];
                    
                    // Mark item as completed by the team
                    newChecked[itemId] = { 
                        user: selectedMembers[0], // Primary for display
                        users: selectedMembers,   // All who did it
                        timestamp: now,
                        isTeam: teamSize > 1
                    };
                    
                    // Give EACH team member their (secretly boosted) points!
                    selectedMembers.forEach(member => {
                        if (newTeam[member]) {
                            const newTeamTasks = (newTeam[member].teamTasks || 0) + (teamSize > 1 ? 1 : 0);
                            newTeam[member] = {
                                ...newTeam[member],
                                points: newTeam[member].points + actualPoints,

                        completers.forEach(user => {
                            if (newTeam[user]) {
                                const teamSize = completers.length;
                                const actualPoints = teamSize > 1 
                                    ? Math.round(task.points * (1 + 0.25 * (teamSize - 1)))
                                    : task.points;
                                newTeam[user] = {
                                    ...newTeam[user],
                                    points: Math.max(0, newTeam[user].points - actualPoints),
                                    tasksCompleted: Math.max(0, newTeam[user].tasksCompleted - 1)
                                };
                            }
                        });
                    } else {
                        newChecked[task.id] = { user: currentUser, users: [currentUser], timestamp: now };
                        newTeam[currentUser] = {
                            ...newTeam[currentUser],
                            points: (newTeam[currentUser]?.points || 0) + task.points,
                            tasksCompleted: (newTeam[currentUser]?.tasksCompleted || 0) + 1
                        };
                        newLog.push({ id: task.id, user: currentUser, users: [currentUser], timestamp: now, points: task.points, isCustom: true });
                    }
                    
                    return { ...prev, checkedItems: newChecked, teamMembers: newTeam, completionLog: newLog };
                });
            };

            // ============================================
            // SUPPLIES LIST MANAGEMENT
            // ============================================
            const addSupply = () => {
                if (!newSupplyText.trim() || !currentUser) return;
                
                const supplyId = 'supply_' + Date.now();
                setSessionData(prev => ({
                    ...prev,
                    supplies: [
                        ...(prev.supplies || []),
                        {
                            id: supplyId,
                            text: newSupplyText.trim(),
                            checked: false,
                            addedBy: currentUser,
                            addedAt: new Date().toISOString()
                        }
                    ]
                }));
                setNewSupplyText('');
            };

            const toggleSupply = (supplyId) => {
                setSessionData(prev => ({
                    ...prev,
                    supplies: (prev.supplies || []).map(s => 
                        s.id === supplyId ? { ...s, checked: !s.checked } : s
                    )
                }));
            };

            const removeSupply = (supplyId) => {
                setSessionData(prev => ({
                    ...prev,
                    supplies: (prev.supplies || []).filter(s => s.id !== supplyId)
                }));
            };

            // ============================================
            // CHECK FOR BADGE UNLOCKS
            // ============================================
            const checkBadges = (user, userData, checkedItems) => {
                const earnedBadges = userData.badges || [];
                
                // First task badge
                if (userData.tasksCompleted === 1 && !earnedBadges.includes('first_task')) {
                    unlockBadge(user, 'first_task');
                }
                
                // Section completion badges
                const kitchenItems = sections.kitchen.items.map(i => i.id);
                const kitchenComplete = kitchenItems.every(id => checkedItems[id]);
                if (kitchenComplete && !earnedBadges.includes('kitchen_master')) {
                    unlockBadge(user, 'kitchen_master');
                }
                
                // Time-based badges
                const hour = new Date().getHours();
                if (hour < 8 && !earnedBadges.includes('early_bird')) {
                    unlockBadge(user, 'early_bird');
                }
                if (hour >= 20 && !earnedBadges.includes('night_owl')) {
                    unlockBadge(user, 'night_owl');
                }
            };

            const unlockBadge = (user, badgeId) => {
                const badge = BADGES.find(b => b.id === badgeId);
                if (badge) {
                    setNewBadge(badge);
                    setTimeout(() => setNewBadge(null), 3000);
                    
                    setSessionData(prev => ({
                        ...prev,
                        teamMembers: {
                            ...prev.teamMembers,
                            [user]: {
                                ...prev.teamMembers[user],
                                badges: [...(prev.teamMembers[user]?.badges || []), badgeId]
                            }
                        }
                    }));
                }
            };

            // ============================================
            // CALCULATE PROGRESS
            // ============================================
            const getProgress = () => {
                if (!sessionData) return { checked: 0, total: 0, points: 0, maxPoints: 0 };
                
                // Standard section items
                const allItems = Object.values(sections).flatMap(s => s.items);
                
                // Add custom tasks
                const customTasks = sessionData.customTasks || [];
                const allTasksWithCustom = [...allItems, ...customTasks];
                
                const checked = allTasksWithCustom.filter(item => sessionData.checkedItems[item.id]).length;
                const earnedPoints = allTasksWithCustom
                    .filter(item => sessionData.checkedItems[item.id])
                    .reduce((sum, item) => sum + item.points, 0);
                const maxPoints = allTasksWithCustom.reduce((sum, item) => sum + item.points, 0);
                
                return { checked, total: allTasksWithCustom.length, points: earnedPoints, maxPoints };
            };

            const getSectionProgress = (sectionKey) => {
                if (!sessionData) return { checked: 0, total: 0 };
                
                // Handle custom section specially
                if (sectionKey === 'custom') {
                    const customTasks = sessionData.customTasks || [];
                    const checked = customTasks.filter(item => sessionData.checkedItems[item.id]).length;
                    return { checked, total: customTasks.length };
                }
                
                const section = sections[sectionKey];
                if (!section) return { checked: 0, total: 0 };
                const checked = section.items.filter(item => sessionData.checkedItems[item.id]).length;
                return { checked, total: section.items.length };
            };

            // ============================================
            // GET USER LEVEL
            // ============================================
            const getUserLevel = (points) => {
                let level = LEVELS[0];
                for (const l of LEVELS) {
                    if (points >= l.minPoints) level = l;
                }
                return level;
            };

            // ============================================
            // COPY SHARE LINK
            // ============================================
            const copyShareLink = () => {
                const link = `${window.location.origin}${window.location.pathname}?session=${sessionId}`;
                navigator.clipboard.writeText(link);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);

            // ============================================
            // RENDER: HOME VIEW
            // ============================================
            if (view === 'home') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-pink-50 via-white to-purple-50">

                        <main className="max-w-4xl mx-auto p-6">
                            <div className="grid md:grid-cols-2 gap-6">

                                <button
                                    onClick={() => setView('create')}
                                    className="bg-white rounded-3xl shadow-xl p-8 text-left hover:scale-105 transition-all border-2 border-pink-100 hover:border-pink-300"
                                >
                                    <div className="text-5xl mb-4 float">🚀</div>
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">Let's GOOOO! 🔥</h2>
                                    <p className="text-gray-500">Start a new session & invite the squad</p>
                                    <div className="mt-4 text-pink-500 font-bold">Create Session →</div>
                                </button>
                                
                                {/* Join Session */}
                                <div className="bg-white rounded-3xl shadow-xl p-8 border-2 border-purple-100">
                                    <div className="text-5xl mb-4">🤝</div>
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">Join the Fun!</h2>
                                    <p className="text-gray-500 mb-4">Got a link? Paste it or enter code</p>

                                    <div className="font-bold text-gray-800">Gamified</div>

                                </div>

                                    <div className="font-bold text-gray-800">Secret Bonuses</div>
                                    <div className="text-xs text-gray-500">Find hidden multipliers!</div>

                                <div className="bg-white rounded-2xl p-4 shadow hover:scale-105 transition-all">
                                    <div className="text-3xl mb-2">🏆</div>

                            <div className="mt-8 text-center">
                                <p className="text-gray-400 text-sm">

                            <p className="text-xs text-pink-200 mt-1">Making boring things FUN since 2026 🎉</p>

                    </div>

                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-1">⏰ Time</label>
                                            <input
                                                type="time"
                                                value={createForm.time}
                                                onChange={(e) => setCreateForm({...createForm, time: e.target.value})}
                                                className="w-full p-3 border-2 border-pink-200 rounded-xl focus:border-pink-400 focus:outline-none"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-1">📝 Notes (optional)</label>
                                        <textarea
                                            value={createForm.notes}
                                            onChange={(e) => setCreateForm({...createForm, notes: e.target.value})}
                                            placeholder="Special instructions, access codes, etc..."
                                            className="w-full p-3 border-2 border-pink-200 rounded-xl focus:border-pink-400 focus:outline-none min-h-20"
                                        />
                                    </div>
                                    
                                    <button
                                        onClick={createSession}
                                        disabled={!createForm.propertyName}
                                        className={`w-full py-4 rounded-xl font-bold text-lg transition-all ${
                                            createForm.propertyName
                                                ? 'bg-gradient-to-r from-pink-500 to-purple-500 text-white hover:from-pink-600 hover:to-purple-600 shadow-lg'
                                                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                        }`}
                                    >
                                        🚀 Create Session & Get Link
                                    </button>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            // ============================================
            // RENDER: MAIN SESSION VIEW
            // ============================================
            if (!sessionData) return <div className="p-8 text-center">Loading...</div>;

            const progress = getProgress();
            const progressPercent = Math.round((progress.checked / progress.total) * 100);

            // ============================================
            // JOIN PROMPT (if not yet joined)
            // ============================================
            if (!currentUser) {
                // Calculate elapsed time for display on join screen
                const joinScreenElapsed = sessionData.timerStartedAt 
                    ? Math.floor((Date.now() - new Date(sessionData.timerStartedAt).getTime()) / 1000)
                    : 0;
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-pink-50 via-white to-purple-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full border-2 border-pink-100">
                            <div className="text-center mb-6">
                                <div className="text-5xl mb-4">🏠</div>
                                <h1 className="text-2xl font-bold text-gray-800">{sessionData.property}</h1>
                                <p className="text-gray-500">{sessionData.location}</p>
                                <p className="text-sm text-gray-400 mt-2">
                                    📅 {new Date(sessionData.date).toLocaleDateString()} at {sessionData.time}
                                </p>
                                
                                {/* Timer Status */}
                                {sessionData.completedAt ? (
                                    <div className="mt-4 bg-green-100 text-green-700 rounded-xl p-3">
                                        <div className="text-sm">✅ COMPLETED IN</div>
                                        <div className="text-2xl font-bold font-mono">{formatTime(sessionData.completionTime)}</div>
                                    </div>
                                ) : sessionData.timerStartedAt ? (
                                    <div className="mt-4 bg-pink-100 text-pink-700 rounded-xl p-3">
                                        <div className="text-sm">⏱️ IN PROGRESS</div>
                                        <div className="text-2xl font-bold font-mono">{formatTime(joinScreenElapsed)}</div>
                                        <div className="text-xs opacity-70">Timer running!</div>
                                    </div>
                                ) : (
                                    <div className="mt-4 bg-gray-100 text-gray-600 rounded-xl p-3">
                                        <div className="text-sm">⏱️ READY TO START</div>
                                        <div className="text-xs">Timer begins when you join!</div>
                                    </div>
                                )}
                            </div>
                            
                            {/* Team Member Buttons */}
                            <div className="mb-6">
                                <label className="block text-sm font-bold text-gray-700 mb-3 text-center">👥 Who's clocking in?</label>
                                <div className="grid grid-cols-2 gap-3">
                                    {Object.entries(TEAM_MEMBERS).map(([name, style]) => {
                                        const isJoined = sessionData.teamMembers[name];
                                        return (
                                            <button
                                                key={name}
                                                onClick={() => {
                                                    setUserNameInput(name);
                                                    setCurrentUser(name);
                                                    if (!sessionData.teamMembers[name]) {
                                                        setSessionData(prev => ({
                                                            ...prev,
                                                            timerStartedAt: prev.timerStartedAt || new Date().toISOString(),
                                                            teamMembers: {
                                                                ...prev.teamMembers,
                                                                [name]: {
                                                                    joinedAt: new Date().toISOString(),
                                                                    points: 0,
                                                                    tasksCompleted: 0,
                                                                    badges: [],
                                                                    color: style.color
                                                                }
                                                            }
                                                        }));
                                                    }
                                                }}
                                                className={`p-4 rounded-xl border-3 text-center transition-all hover:scale-105 ${
                                                    isJoined ? 'opacity-90' : ''
                                                }`}
                                                style={{ 
                                                    borderColor: style.color,
                                                    backgroundColor: `${style.color}15`
                                                }}
                                            >
                                                <div className="text-3xl mb-1">{style.emoji}</div>
                                                <div className="font-bold" style={{ color: style.color }}>{name}</div>
                                                {isJoined && (
                                                    <div className="text-xs text-gray-500 mt-1">
                                                        ✓ {sessionData.teamMembers[name].points} pts
                                                    </div>
                                                )}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                            
                            {/* Or Custom Name */}
                            <div className="text-center text-gray-400 text-sm mb-3">— or enter custom name —</div>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={userNameInput}
                                    onChange={(e) => setUserNameInput(e.target.value)}
                                    placeholder="Your name..."
                                    className="flex-1 p-3 border-2 border-gray-200 rounded-xl focus:border-pink-400 focus:outline-none"
                                    onKeyDown={(e) => e.key === 'Enter' && joinSession()}
                                />
                                <button
                                    onClick={joinSession}
                                    className="bg-gradient-to-r from-pink-500 to-purple-500 text-white px-6 rounded-xl font-bold hover:from-pink-600 hover:to-purple-600 transition-all"
                                >
                                    Join
                                </button>
                            </div>
                            
                            {/* Currently Active */}
                            {Object.keys(sessionData.teamMembers).length > 0 && (
                                <div className="mt-6 pt-6 border-t border-gray-200">
                                    <p className="text-sm text-gray-500 mb-2 text-center">🔥 Currently Active:</p>
                                    <div className="flex flex-wrap gap-2 justify-center">
                                        {Object.entries(sessionData.teamMembers).map(([name, data]) => {
                                            const style = getMemberStyle(name);
                                            return (
                                                <span 
                                                    key={name} 
                                                    className="px-3 py-1 rounded-full text-sm font-bold text-white"
                                                    style={{ backgroundColor: style.color }}
                                                >
                                                    {style.emoji} {name} ({data.points} pts)
                                                </span>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ============================================
            // MAIN SESSION INTERFACE
            // ============================================
            const userPoints = sessionData.teamMembers[currentUser]?.points || 0;
            const userLevel = getUserLevel(userPoints);
            const currentUserStyle = getMemberStyle(currentUser);

            return (
                <div className="min-h-screen bg-gradient-to-br from-pink-50 via-white to-purple-50">
                    {/* SHARE MODAL - Shows after creating session */}
                    {showShareModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl bounce-in">
                                <div className="text-6xl mb-4">🔗</div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">Session Created!</h2>
                                <p className="text-gray-500 mb-4">Share this link with your team:</p>
                                
                                <div className="bg-gray-100 rounded-xl p-4 mb-4 break-all text-sm font-mono">
                                    {`${window.location.origin}${window.location.pathname}?session=${sessionId}`}

                                <button
                                    onClick={() => {
                                        copyShareLink();
                                        setTimeout(() => setCopied(false), 2000);
                                    }}
                                    className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-bold text-lg hover:from-pink-600 hover:to-purple-600 transition-all mb-3"

                                </button>
                                
                                <button

                    {/* COMPLETION MODAL - Shows when 100% done */}

                                        <div className="bg-white/20 rounded-xl p-2">
                                            <div className="text-xl font-bold">{userPoints}</div>
                                            <div className="text-xs">Points</div>
                                        </div>
                                        <div className="bg-white/20 rounded-xl p-2">
                                            <div className="text-xl font-bold">{userLevel.level}</div>
                                            <div className="text-xs">Level</div>
                                        </div>
                                        <div className="bg-white/20 rounded-xl p-2">
                                            <div className="text-xl font-bold">
                                                {sessionData.teamMembers[currentUser]?.teamTasks || 0}
                                                {(sessionData.teamMembers[currentUser]?.teamTasks || 0) > 0 && <span className="text-sm">👥</span>}
                                            </div>
                                            <div className="text-xs">Collabs</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Notes */}
                                {sessionData.notes && (
                                    <div className="bg-yellow-50 border-2 border-yellow-200 rounded-2xl p-4 mb-4">
                                        <h3 className="font-bold text-yellow-700 mb-1">📝 Session Notes</h3>
                                        <p className="text-yellow-800">{sessionData.notes}</p>
                                    </div>
                                )}
                            </>
                        )}

                        {/* Leaderboard View */}
                        {activeSection === 'leaderboard' && (
                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden border-2 border-pink-100">
                                <div className="bg-gradient-to-r from-pink-500 to-purple-500 text-white p-4">
                                    <h2 className="text-xl font-bold">🏆 Leaderboard</h2>
                                </div>
                                <div className="p-4">
                                    {Object.entries(sessionData.teamMembers)
                                        .sort((a, b) => b[1].points - a[1].points)
                                        .map(([name, data], index) => {
                                            const level = getUserLevel(data.points);
                                            const style = getMemberStyle(name);
                                            const teamTasks = data.teamTasks || 0;
                                            return (
                                                <div
                                                    key={name}
                                                    className={`flex items-center gap-3 p-3 rounded-xl mb-2 ${
                                                        name === currentUser ? 'ring-2 ring-offset-2' : ''
                                                    }`}
                                                    style={{ 
                                                        backgroundColor: `${style.color}15`,
                                                        borderLeft: `4px solid ${style.color}`,
                                                        ringColor: name === currentUser ? style.color : 'transparent'
                                                    }}
                                                >
                                                    <div className={`text-2xl font-bold w-8 ${
                                                        index === 0 ? 'text-yellow-500' :
                                                        index === 1 ? 'text-gray-400' :
                                                        index === 2 ? 'text-orange-400' : 'text-gray-300'
                                                    }`}>
                                                        {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`}
                                                    </div>
                                                    <div className="text-2xl">{style.emoji}</div>
                                                    <div className="flex-1">
                                                        <div className="font-bold flex items-center gap-1" style={{ color: style.color }}>
                                                            {name}
                                                            {teamTasks > 0 && (
                                                                <span className="text-xs bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded-full">
                                                                    👥{teamTasks}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <div className="text-xs text-gray-500">{level.emoji} {level.name} • {data.tasksCompleted} tasks</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="font-bold text-xl" style={{ color: style.color }}>{data.points}</div>
                                                        <div className="text-xs text-gray-500">points</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    {Object.keys(sessionData.teamMembers).length === 0 && (
                                        <p className="text-center text-gray-400 py-8">No one has joined yet!</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Activity Feed */}
                        {activeSection === 'activity' && (
                            <div className="bg-white rounded-2xl shadow-lg overflow-hidden border-2 border-pink-100">
                                <div className="bg-gradient-to-r from-pink-500 to-purple-500 text-white p-4">
                                    <h2 className="text-xl font-bold">📜 Activity Feed</h2>
                                </div>
                                <div className="p-4 max-h-96 overflow-y-auto">
                                    {sessionData.completionLog.slice().reverse().slice(0, 50).map((log, i) => {
                                        const item = Object.values(sections).flatMap(s => s.items).find(item => item.id === log.id);
                                        const isTeam = log.users?.length > 1;
                                        const firstUserStyle = getMemberStyle(log.users?.[0] || log.user);
                                        
                                        return (
                                            <div 
                                                key={i} 
                                                className="flex items-start gap-3 p-2 border-b border-gray-100 last:border-0"
                                                style={{ borderLeftColor: firstUserStyle.color, borderLeftWidth: '3px' }}
                                            >
                                                {isTeam ? (
                                                    // Team completion - show stacked emojis
                                                    <div className="flex -space-x-1">
                                                        {log.users.slice(0, 3).map((user, idx) => {
                                                            const uStyle = getMemberStyle(user);
                                                            return (
                                                                <span key={user} className="text-lg" style={{ zIndex: 3 - idx }}>
                                                                    {uStyle.emoji}
                                                                </span>
                                                            );
                                                        })}
                                                    </div>
                                                ) : (
                                                    <div className="text-lg">{firstUserStyle.emoji}</div>
                                                )}
                                                <div className="flex-1">
                                                    <div className="text-sm">
                                                        {isTeam ? (
                                                            <>
                                                                <span className="font-bold text-purple-600">
                                                                    {log.users.join(' + ')}
                                                                </span>
                                                                <span className="text-purple-500 text-xs ml-1">TEAM</span>
                                                            </>
                                                        ) : (
                                                            <span className="font-bold" style={{ color: firstUserStyle.color }}>
                                                                {log.user}
                                                            </span>
                                                        )}
                                                        <span className="text-gray-600"> completed </span>
                                                        <span className="text-gray-800">{item?.text.substring(0, 30)}...</span>
                                                    </div>
                                                    <div className="text-xs text-gray-400">
                                                        +{log.points} pts {isTeam && 'each'} • {new Date(log.timestamp).toLocaleTimeString()}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {sessionData.completionLog.length === 0 && (
                                        <p className="text-center text-gray-400 py-8">No activity yet. Start checking off tasks!</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Section Detail View */}
                        {sections[activeSection] && (
                            <>
                                <button
                                    onClick={() => setActiveSection('dashboard')}
                                    className="mb-4 text-pink-600 font-bold flex items-center gap-2 hover:text-pink-700"
                                >
                                    ← Back to Dashboard
                                </button>
                                
                                <div className="bg-white rounded-2xl shadow-lg overflow-hidden border-2 border-pink-100">
                                    <div className={`bg-gradient-to-r ${sections[activeSection].color} text-white p-4`}>
                                        <h2 className="text-xl font-bold">{sections[activeSection].title}</h2>
                                        <p className="text-sm opacity-80">
                                            {getSectionProgress(activeSection).checked}/{getSectionProgress(activeSection).total} • Tap ✓ solo or 👥 for team!
                                        </p>
                                    </div>
                                    
                                    <div className="p-2">
                                        {sections[activeSection].items.map((item) => {
                                            const checked = sessionData.checkedItems[item.id];
                                            const checkerStyle = checked ? getMemberStyle(checked.user) : null;
                                            const isTeamComplete = checked?.users?.length > 1;
                                            
                                            return (
                                                <div
                                                    key={item.id}
                                                    className={`flex items-center gap-2 p-3 rounded-xl transition-all ${
                                                        checked 
                                                            ? 'border-2' 
                                                            : 'hover:bg-pink-50 border-2 border-transparent'
                                                    }`}
                                                    style={checked ? {
                                                        backgroundColor: `${checkerStyle.color}10`,
                                                        borderColor: `${checkerStyle.color}50`
                                                    } : {}}
                                                >
                                                    {/* Checkbox - click to solo complete */}
                                                    <input
                                                        type="checkbox"
                                                        checked={!!checked}
                                                        onChange={() => toggleItem(item.id, item.points)}
                                                        className="w-6 h-6 rounded-lg accent-pink-500 cursor-pointer flex-shrink-0"
                                                    />
                                                    
                                                    {/* Task text */}
                                                    <span 
                                                        className={`flex-1 cursor-pointer ${checked ? 'line-through text-gray-400' : 'text-gray-700'}`}
                                                        onClick={() => toggleItem(item.id, item.points)}
                                                    >
                                                        {item.text}
                                                    </span>
                                                    
                                                    {/* Points badge */}
                                                    <span className={`text-xs px-2 py-1 rounded-full flex-shrink-0 ${
                                                        checked ? 'bg-green-100 text-green-600' : 'bg-pink-100 text-pink-600'
                                                    }`}>
                                                        +{item.points}
                                                    </span>
                                                    
                                                    {/* Team button (only show if not checked) */}
                                                    {!checked && (
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                openTeamComplete(item);
                                                            }}
                                                            className="text-xs px-2 py-1 rounded-full bg-purple-100 text-purple-600 hover:bg-purple-200 transition-all flex-shrink-0 font-bold"
                                                            title="Complete as a team"
                                                        >
                                                            👥
                                                        </button>
                                                    )}
                                                    
                                                    {/* Show who completed it */}
                                                    {checked && (
                                                        <div className="flex items-center gap-1 flex-shrink-0">
                                                            {isTeamComplete ? (
                                                                // Multiple people - show all with stacked avatars
                                                                <div className="flex items-center">
                                                                    <div className="flex -space-x-2">
                                                                        {checked.users.slice(0, 3).map((user, i) => {
                                                                            const uStyle = getMemberStyle(user);
                                                                            return (
                                                                                <span 
                                                                                    key={user}
                                                                                    className="w-6 h-6 rounded-full flex items-center justify-center text-xs border-2 border-white"
                                                                                    style={{ backgroundColor: uStyle.color, zIndex: 3 - i }}
                                                                                    title={user}
                                                                                >
                                                                                    {uStyle.emoji}
                                                                                </span>
                                                                            );
                                                                        })}
                                                                    </div>
                                                                    {checked.users.length > 3 && (
                                                                        <span className="text-xs text-gray-500 ml-1">+{checked.users.length - 3}</span>
                                                                    )}
                                                                    <span className="text-xs ml-1 text-purple-500 font-bold">TEAM</span>
                                                                </div>
                                                            ) : (
                                                                // Single person
                                                                <span 
                                                                    className="text-xs px-2 py-1 rounded-full text-white font-bold"
                                                                    style={{ backgroundColor: checkerStyle.color }}
                                                                >
                                                                    {checkerStyle.emoji} {checked.user}
                                                                </span>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-gradient-to-r from-pink-500 to-purple-500 text-white p-4 mt-8 text-center">
                        <p className="font-bold">🌸 Pink Revolution • Overkor-tek 🌸</p>
                        <p className="text-xs text-pink-100 mt-1">✨ Sparkle Squad v2.0 • Team Edition ✨</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<TurnoverProApp />, document.getElementById('root'));
    </script>
</body>
</html>
